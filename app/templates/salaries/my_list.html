{% extends "shell.html" %}
{% block content %}
<h4 class="mb-3">My Salary History</h4>
<div class="card shadow-sm">
  <div class="table-responsive">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light"><tr><th>Month</th><th>Net Salary</th><th>Status</th><th></th></tr></thead>
      <tbody>
        {% for r in records %}
        <tr>
          <td>{{ r.month.strftime("%B %Y") }}</td>
          <td>{{ compute_net_salary(r) }}</td>
          <td><span class="badge {{ 'bg-success' if r.payment_status.value == 'paid' else 'bg-warning text-dark' }}">{{ r.payment_status.value.title() }}</span></td>
          <td class="text-end"><a href="{{ url_for('salaries.view_salary', salary_id=r.id) }}" class="btn btn-outline-primary btn-sm">View</a></td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-center text-muted py-4">No salary records yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
