{% extends "shell.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Expense Categories</h4>
  <a href="{{ url_for('expenses.category_new') }}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> New Category</a>
</div>
<div class="card shadow-sm">
  <div class="table-responsive">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-light"><tr><th>Name</th><th>Status</th><th></th></tr></thead>
      <tbody>
        {% for c in categories %}
        <tr>
          <td>{{ c.name }}</td>
          <td><span class="badge {{ 'bg-success' if c.status.value == 'active' else 'bg-secondary' }}">{{ c.status.value.title() }}</span></td>
          <td class="text-end">
            <a href="{{ url_for('expenses.category_edit', category_id=c.id) }}" class="btn btn-outline-secondary btn-sm">Edit</a>
            <form method="POST" action="{{ url_for('expenses.category_toggle_status', category_id=c.id) }}" class="d-inline">
              <button type="submit" class="btn btn-outline-secondary btn-sm">{{ "Deactivate" if c.status.value == "active" else "Activate" }}</button>
            </form>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="3" class="text-center text-muted py-4">No expense categories yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
<a href="{{ url_for('expenses.list_expenses') }}" class="btn btn-outline-secondary btn-sm mt-3">Back to Expenses</a>
{% endblock %}
